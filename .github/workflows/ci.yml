name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    # Real Postgres for the database tests, which skip without DATABASE_URL.
    # The password only exists for this job.
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          DATABASE_URL: postgres://app:ci-only@localhost:5432/app?sslmode=disable
        run: go test -race -cover ./...

      - name: Docker build
        run: docker build -t pokewordle-api .
